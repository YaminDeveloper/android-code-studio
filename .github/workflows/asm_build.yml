name: Build Android Code Studio

on:
  push:
    branches: ["dev", "main", "indexing", "release/**"]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        run: ./gradlew :core:app:assembleDebug

      - name: Upload arm64-v8a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-debug
          path: core/app/build/outputs/apk/debug/*arm64-v8a*.apk
        if: always()

      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-debug
          path: core/app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if: always()

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-debug
          path: core/app/build/outputs/apk/debug/*x86_64*.apk
        if: always()
